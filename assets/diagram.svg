<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Схема: браузер, exit и сайт</title>
  <desc id="diagram-desc">Прокси режет одно TCP-соединение на два: сайт видит только вторую машину — exit. Антифрод сравнивает сетевой слой exit с браузерным слоем, и расхождение между ними — сигнал.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .h { font: 700 21px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #1f2328; }
      .lead { font: 400 15px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #59636e; }
      .card-h { font: 700 18px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #1f2328; }
      .sub { font: 400 14px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #59636e; }
      .mono { font: 400 17px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #1f2328; }
      .note { font: 400 15px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #59636e; }
      .lbl { font: 600 13.5px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #59636e; }
      .flow { stroke: #59636e; stroke-width: 1.8; fill: none; }
      .head { fill: #59636e; }
      .dash { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 4 4; }
      .warn { fill: #cf222e; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .card { fill: #161b22; stroke: #30363d; }
        .h, .card-h, .mono { fill: #e6edf3; }
        .lead, .sub, .note, .lbl { fill: #9198a1; }
        .flow { stroke: #9198a1; }
        .head { fill: #9198a1; }
        .dash { stroke: #30363d; }
        .warn { fill: #f85149; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="480" height="800"/>

  <text class="h" x="32" y="46">Что сравнивает антифрод</text>
  <text class="lead" x="32" y="74">Прокси режет одно TCP-соединение на два:</text>
  <text class="lead" x="32" y="96">сайт видит только вторую машину — exit.</text>

  <rect class="card" x="32" y="116" width="416" height="150" rx="12"/>
  <text class="card-h" x="56" y="150">Браузер</text>
  <text class="sub" x="56" y="172">что отдаёт JS:</text>
  <text class="mono" x="56" y="202">UA, Client Hints</text>
  <text class="mono" x="56" y="228">Canvas, WebGL, шрифты</text>
  <text class="mono" x="56" y="254">WebRTC, DNS, поведение</text>

  <line class="flow" x1="240" y1="274" x2="240" y2="306" marker-end="url(#arrow)"/>
  <text class="lbl" x="254" y="296">TCP #1</text>

  <rect class="card" x="32" y="318" width="416" height="150" rx="12"/>
  <text class="card-h" x="56" y="352">Exit / прокси</text>
  <text class="sub" x="56" y="374">что видно в пакетах:</text>
  <text class="mono" x="56" y="404">TTL, окно, опции TCP</text>
  <text class="mono" x="56" y="430">MSS, WS, RTT, джиттер</text>
  <text class="mono" x="56" y="456">JA4T, QUIC-параметры</text>

  <line class="flow" x1="240" y1="476" x2="240" y2="508" marker-end="url(#arrow)"/>
  <text class="lbl" x="254" y="498">TCP #2</text>

  <rect class="card" x="32" y="520" width="416" height="150" rx="12"/>
  <text class="card-h" x="56" y="554">Сайт / антифрод</text>
  <text class="sub" x="56" y="576">сверяет обе картины:</text>
  <text class="mono" x="56" y="606">сеть vs браузер</text>
  <text class="mono" x="56" y="632">IP, ASN, PTR, гео</text>
  <text class="mono" x="56" y="658">репутация, поведение</text>

  <line class="dash" x1="32" y1="692" x2="448" y2="692"/>

  <text class="note" x="32" y="720">Сайт видит только exit: его TTL, окно, опции, RTT.</text>
  <text class="note" x="32" y="746">UA и Client Hints принадлежат браузеру.</text>
  <text class="note" x="32" y="772"><tspan class="warn">Расхождение слоёв</tspan> — сигнал, а не сам прокси.</text>
</svg>
