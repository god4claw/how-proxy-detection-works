<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 438" width="1100" height="438" role="img" aria-label="Схема: браузер, exit и сайт — две независимые машины, которые сравнивает антифрод">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .h { font: 700 17px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #1f2328; }
      .sub { font: 400 12px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #6e7781; }
      .mono { font: 400 12.5px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #1f2328; }
      .lbl { font: 600 11.5px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #6e7781; }
      .note { font: 400 13px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #57606a; }
      .accent { fill: #cf222e; }
      .good { fill: #1a7f37; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="438"/>

  <text class="h" x="36" y="44">Две машины, которые сравнивает антифрод</text>
  <text class="note" x="36" y="68">Прокси режет одно TCP-соединение на два. Сайт видит только вторую машину — exit.</text>

  <!-- ЛЕВАЯ КАРТОЧКА: БРАУЗЕР -->
  <rect class="card" x="36" y="94" width="282" height="196" rx="10"/>
  <text class="h" x="60" y="126" style="font-size:16px">Браузер</text>
  <text class="sub" x="60" y="146">что отдаёт JS:</text>
  <text class="mono" x="60" y="174">UA, Client Hints</text>
  <text class="mono" x="60" y="198">Canvas, WebGL, шрифты</text>
  <text class="mono" x="60" y="222">WebRTC, DNS</text>
  <text class="mono" x="60" y="246">таймзона, поведение</text>

  <!-- СРЕДНЯЯ КАРТОЧКА: EXIT -->
  <rect class="card" x="409" y="94" width="282" height="196" rx="10"/>
  <text class="h" x="433" y="126" style="font-size:16px">Exit / прокси</text>
  <text class="sub" x="433" y="146">что видно в пакетах:</text>
  <text class="mono" x="433" y="174">initial TTL, окно, опции</text>
  <text class="mono" x="433" y="198">MSS, MTU, window scale</text>
  <text class="mono" x="433" y="222">RTT, джиттер, скорость</text>
  <text class="mono" x="433" y="246">JA4T, QUIC-параметры</text>

  <!-- ПРАВАЯ КАРТОЧКА: САЙТ -->
  <rect class="card" x="782" y="94" width="282" height="196" rx="10"/>
  <text class="h" x="806" y="126" style="font-size:16px">Сайт / антифрод</text>
  <text class="sub" x="806" y="146">сверяет обе картины:</text>
  <text class="mono" x="806" y="174">слои совпадают?</text>
  <text class="mono" x="806" y="198">IP, ASN, PTR, гео</text>
  <text class="mono" x="806" y="222">репутация и история</text>
  <text class="mono" x="806" y="246">поведение и аккаунт</text>

  <!-- СТРЕЛКИ -->
  <line x1="318" y1="192" x2="403" y2="192" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="lbl" x="361" y="180" text-anchor="middle">TCP #1</text>
  <line x1="691" y1="192" x2="776" y2="192" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="lbl" x="733" y="180" text-anchor="middle">TCP #2</text>

  <!-- НИЖНИЕ ЗАМЕТКИ -->
  <line x1="36" y1="318" x2="1064" y2="318" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="note" x="36" y="346">Сайт видит только exit: его TTL, его окно, его порядок TCP-опций, его RTT. UA и Client Hints принадлежат браузеру.</text>
  <text class="note" x="36" y="372">Пока слои сходятся — прокси невидим. <tspan style="fill:#cf222e">Расхождение между слоями — сигнал, а не сам прокси.</tspan></text>
  <text class="note" x="36" y="398"><tspan style="fill:#1a7f37">Эталон:</tspan> Windows 11 + Windows-стек. <tspan style="fill:#cf222e">Антипример:</tspan> UA Windows + Linux-стек за датацентром.</text>
</svg>
